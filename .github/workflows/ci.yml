name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (includes the PostgreSQL integration tests, which need Docker)
        run: mvn -B -ntp verify
      - name: Check the backup scripts and run the backup and restore drill self-test
        run: |
          docker run --rm -v "$PWD/deploy/backup:/mnt:ro" koalaman/shellcheck:v0.11.0 \
            /mnt/postgres-backup.sh /mnt/restore-drill.sh /mnt/self-test.sh
          bash deploy/backup/self-test.sh
      - name: Check and unit-test the Prometheus SLO and PostgreSQL recovery rules and alerts
        run: >-
          docker run --rm -v "$PWD/deploy/observability/prometheus:/rules:ro" -w /rules --entrypoint promtool
          prom/prometheus:v3.13.4 check rules notification-slo.rules.yml
          && docker run --rm -v "$PWD/deploy/observability/prometheus:/rules:ro" -w /rules --entrypoint promtool
          prom/prometheus:v3.13.4 test rules notification-slo.test.yml
          && docker run --rm -v "$PWD/deploy/observability/prometheus:/rules:ro" -w /rules --entrypoint promtool
          prom/prometheus:v3.13.4 check rules postgres-recovery.rules.yml
          && docker run --rm -v "$PWD/deploy/observability/prometheus:/rules:ro" -w /rules --entrypoint promtool
          prom/prometheus:v3.13.4 test rules postgres-recovery.test.yml
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-reports
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  ui:
    name: ${{ matrix.app }} build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [admin-ui, client-ui]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        if: matrix.app == 'client-ui'
        run: npm test
      - name: Known vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  deployment:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDS: aws azure gcp
      CRD_CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/f1e7f6bc0537bf0622ffe6e47dbaa85914fabbec # before #988 broke SecretStore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint the chart
        run: >-
          docker run --rm -v "$PWD/deploy:/deploy" -w /deploy alpine/helm:4.3.0
          lint helm/notification-service --strict
      - name: Render with default, development and each cloud's values and validate against the Kubernetes schemas
        run: |
          values_files=("" "k8s/dev/values-k3s.yaml")
          for cloud in $CLOUDS; do values_files+=("helm/notification-service/values-$cloud.yaml"); done
          for values_file in "${values_files[@]}"; do
            values_arguments=()
            if [ -n "$values_file" ]; then values_arguments=(-f "$values_file"); fi
            docker run --rm -v "$PWD/deploy:/deploy" -w /deploy alpine/helm:4.3.0 \
              template notification helm/notification-service "${values_arguments[@]}" > rendered.yaml
            if grep -n "from: \[\]" rendered.yaml; then
              echo "A NetworkPolicy allows traffic from anywhere"; exit 1
            fi
            docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.8.0 \
              -strict -summary -kubernetes-version 1.33.0 /work/rendered.yaml
          done
      - name: Validate the development datastores manifest and every cloud's Pulsar storage class
        run: |
          manifests=(/work/deploy/k8s/dev/datastores.yaml)
          for cloud in $CLOUDS; do manifests+=("/work/deploy/k8s/pulsar/storage-class-$cloud.yaml"); done
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -kubernetes-version 1.33.0 "${manifests[@]}"
      - name: Validate each cloud's manifests with sample values for their placeholders
        env:
          SAMPLE_VALUES: >-
            AWS_REGION=eu-west-1 DISASTER_RECOVERY_REGION=eu-central-1
            APPLICATION_SECRET_ARN=arn:aws:secretsmanager:eu-west-1:111122223333:secret:example-application
            POSTGRES_OWNER_SECRET_ARN=arn:aws:secretsmanager:eu-west-1:111122223333:secret:example-owner
            POSTGRES_ADDRESS=example.rds.amazonaws.com BACKUP_BUCKET=example-backups VPC_CIDR=10.40.0.0/16
            KEY_VAULT_URI=https://example-kv.vault.azure.net/
            EXTERNAL_SECRETS_CLIENT_ID=00000000-0000-0000-0000-000000000001
            LOGICAL_BACKUP_CLIENT_ID=00000000-0000-0000-0000-000000000002
            POSTGRES_FQDN=example.postgres.database.azure.com
            BACKUP_STORAGE_ACCOUNT=examplebackups POSTGRES_SUBNET_CIDR=10.50.64.0/24
            PRIVATE_ENDPOINT_SUBNET_CIDR=10.50.80.0/24
            PROJECT_ID=example-project CLUSTER_LOCATION=europe-west1 CLUSTER_NAME=notification-prod
            SECRET_PREFIX=notification-prod-
            EXTERNAL_SECRETS_SERVICE_ACCOUNT=notif-prod-secrets-sync@example-project.iam.gserviceaccount.com
            LOGICAL_BACKUP_SERVICE_ACCOUNT=notif-prod-db-dump@example-project.iam.gserviceaccount.com
            POSTGRES_PRIVATE_IP=10.70.0.3 PRIVATE_SERVICES_CIDR=10.70.0.0/20
        run: |
          # Placeholders are written ${NAME}; shell variables inside the manifests are written $NAME. Only the listed
          # placeholders are substituted, so the shell variables reach the containers untouched.
          placeholders=""
          for assignment in $SAMPLE_VALUES; do
            export "${assignment?}"
            placeholders="$placeholders \${${assignment%%=*}}"
          done
          for cloud in $CLOUDS; do
            mkdir -p "rendered/$cloud"
            for manifest in "deploy/k8s/$cloud"/*.yaml; do
              envsubst "$placeholders" < "$manifest" > "rendered/$cloud/${manifest##*/}"
            done
          done
          if grep -rn '[$][{]' rendered; then echo "A placeholder was not substituted"; exit 1; fi
          docker run --rm -v "$PWD/rendered:/work" ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -kubernetes-version 1.33.0 -schema-location default \
            -schema-location "$CRD_CATALOG/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" /work
      - name: Render the Pulsar chart with the shared values and validate it
        run: |
          docker run --rm -v "$PWD/deploy/k8s/pulsar:/values" --entrypoint sh alpine/helm:4.3.0 -c \
            "helm repo add apache https://pulsar.apache.org/charts > /dev/null && helm template pulsar apache/pulsar \
            --version 4.7.0 -n pulsar -f /values/values.yaml --set initialize=true" > pulsar-rendered.yaml
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 /work/pulsar-rendered.yaml

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDS: aws azure gcp
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive -diff deploy/terraform
      - name: Test each cloud's datastores module (mocked providers, plan only)
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for cloud in $CLOUDS; do
            terraform -chdir="deploy/terraform/$cloud/modules/datastores" init -input=false
            terraform -chdir="deploy/terraform/$cloud/modules/datastores" test
          done
      - name: Validate each cloud's production environment
        run: |
          for cloud in $CLOUDS; do
            terraform -chdir="deploy/terraform/$cloud/production" init -input=false -backend=false
            terraform -chdir="deploy/terraform/$cloud/production" validate
          done
      - name: Lint with tflint and each cloud's ruleset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for cloud in $CLOUDS; do
            for directory in "$cloud/modules/datastores" "$cloud/production"; do
              docker run --rm -e GITHUB_TOKEN --entrypoint sh -v "$PWD/deploy/terraform:/terraform" \
                -w "/terraform/$directory" ghcr.io/terraform-linters/tflint:v0.64.0 -c \
                "tflint --init --config /terraform/.tflint.hcl > /dev/null && tflint --config /terraform/.tflint.hcl"
            done
          done

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: client-api, context: ., file: Dockerfile, args: "MODULE=client-api" }
          - { name: admin-api, context: ., file: Dockerfile, args: "MODULE=admin-api" }
          - { name: dispatcher, context: ., file: Dockerfile, args: "MODULE=dispatcher" }
          - { name: db-migration, context: ., file: Dockerfile, args: "MODULE=db-migration" }
          - { name: admin-ui, context: admin-ui, file: admin-ui/Dockerfile, args: "" }
          - { name: client-ui, context: client-ui, file: client-ui/Dockerfile, args: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: false
          load: true
          tags: notification/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: notification/${{ matrix.name }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  publish:
    name: Publish signed image (${{ matrix.name }})
    if: github.event_name == 'push'
    needs: [backend, ui, deployment, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: client-api, context: ., file: Dockerfile, args: "MODULE=client-api" }
          - { name: admin-api, context: ., file: Dockerfile, args: "MODULE=admin-api" }
          - { name: dispatcher, context: ., file: Dockerfile, args: "MODULE=dispatcher" }
          - { name: db-migration, context: ., file: Dockerfile, args: "MODULE=db-migration" }
          - { name: admin-ui, context: admin-ui, file: admin-ui/Dockerfile, args: "" }
          - { name: client-ui, context: client-ui, file: client-ui/Dockerfile, args: "" }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/notification-${{ matrix.name }}
      SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: true
          provenance: mode=max
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Generate the SPDX software bill of materials
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          artifact-name: sbom-${{ matrix.name }}.spdx.json
      - name: Sign the image and attest its SBOM (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.name }}.spdx.json" "$IMAGE@$DIGEST"
      - name: Verify the signature and the SBOM attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" "$IMAGE@$DIGEST" > /dev/null
          cosign verify-attestation --type spdxjson --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" "$IMAGE@$DIGEST" > /dev/null
          echo "Published, signed and attested $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
