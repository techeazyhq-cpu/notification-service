name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (includes the PostgreSQL integration tests, which need Docker)
        run: mvn -B -ntp verify
      - name: Check the backup scripts and run the backup and restore drill self-test
        run: |
          docker run --rm -v "$PWD/deploy/backup:/mnt:ro" koalaman/shellcheck:v0.11.0 \
            /mnt/postgres-backup.sh /mnt/restore-drill.sh /mnt/self-test.sh
          bash deploy/backup/self-test.sh
      - name: Check and unit-test the Prometheus SLO and PostgreSQL recovery rules and alerts
        run: >-
          docker run --rm -v "$PWD/deploy/observability/prometheus:/rules:ro" -w /rules --entrypoint promtool
          prom/prometheus:v3.13.4 check rules notification-slo.rules.yml
          && docker run --rm -v "$PWD/deploy/observability/prometheus:/rules:ro" -w /rules --entrypoint promtool
          prom/prometheus:v3.13.4 test rules notification-slo.test.yml
          && docker run --rm -v "$PWD/deploy/observability/prometheus:/rules:ro" -w /rules --entrypoint promtool
          prom/prometheus:v3.13.4 check rules postgres-recovery.rules.yml
          && docker run --rm -v "$PWD/deploy/observability/prometheus:/rules:ro" -w /rules --entrypoint promtool
          prom/prometheus:v3.13.4 test rules postgres-recovery.test.yml
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  ui:
    name: ${{ matrix.app }} build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [admin-ui, client-ui]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        if: matrix.app == 'client-ui'
        run: npm test
      - name: Known vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  deployment:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint the chart
        run: >-
          docker run --rm -v "$PWD/deploy:/deploy" -w /deploy alpine/helm:4.3.0
          lint helm/notification-service --strict
      - name: Render with default and development values and validate against the Kubernetes schemas
        run: |
          for values_file in "" "k8s/dev/values-k3s.yaml"; do
            values_arguments=()
            if [ -n "$values_file" ]; then values_arguments=(-f "$values_file"); fi
            docker run --rm -v "$PWD/deploy:/deploy" -w /deploy alpine/helm:4.3.0 \
              template notification helm/notification-service "${values_arguments[@]}" > rendered.yaml
            if grep -n "from: \[\]" rendered.yaml; then
              echo "A NetworkPolicy allows traffic from anywhere"; exit 1
            fi
            docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.8.0 \
              -strict -summary -kubernetes-version 1.33.0 /work/rendered.yaml
          done
      - name: Validate the development datastores manifest
        run: >-
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.8.0
          -strict -summary -kubernetes-version 1.33.0 /work/deploy/k8s/dev/datastores.yaml

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: client-api, context: ., file: Dockerfile, args: "MODULE=client-api" }
          - { name: admin-api, context: ., file: Dockerfile, args: "MODULE=admin-api" }
          - { name: dispatcher, context: ., file: Dockerfile, args: "MODULE=dispatcher" }
          - { name: db-migration, context: ., file: Dockerfile, args: "MODULE=db-migration" }
          - { name: admin-ui, context: admin-ui, file: admin-ui/Dockerfile, args: "" }
          - { name: client-ui, context: client-ui, file: client-ui/Dockerfile, args: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: false
          load: true
          tags: notification/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: notification/${{ matrix.name }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  publish:
    name: Publish signed image (${{ matrix.name }})
    if: github.event_name == 'push'
    needs: [backend, ui, deployment, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: client-api, context: ., file: Dockerfile, args: "MODULE=client-api" }
          - { name: admin-api, context: ., file: Dockerfile, args: "MODULE=admin-api" }
          - { name: dispatcher, context: ., file: Dockerfile, args: "MODULE=dispatcher" }
          - { name: db-migration, context: ., file: Dockerfile, args: "MODULE=db-migration" }
          - { name: admin-ui, context: admin-ui, file: admin-ui/Dockerfile, args: "" }
          - { name: client-ui, context: client-ui, file: client-ui/Dockerfile, args: "" }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/notification-${{ matrix.name }}
      SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: true
          provenance: mode=max
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Generate the SPDX software bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          artifact-name: sbom-${{ matrix.name }}.spdx.json
      - name: Sign the image and attest its SBOM (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.name }}.spdx.json" "$IMAGE@$DIGEST"
      - name: Verify the signature and the SBOM attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" "$IMAGE@$DIGEST" > /dev/null
          cosign verify-attestation --type spdxjson --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" "$IMAGE@$DIGEST" > /dev/null
          echo "Published, signed and attested $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
