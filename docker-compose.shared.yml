#
# Shared infrastructure (ADR-040): consent-manager's `common` project (its infra/common/compose.yml) provides PostgreSQL,
# Redis, Pulsar and Mailpit on the network `common` instead of docker-compose.common.yml. Only one `common` runs at a
# time (ADR-043). The services join that network either way, so this overlay changes only what differs on the shared
# servers: Redis database 2, and host ports clear of consent-manager's. Start consent-manager's `common` first, then:
#
#   docker compose -f docker-compose.yml -f docker-compose.shared.yml --profile app up -d --build
#
# Host ports: client API 18080, admin API 18081, dispatcher management 18082, catcher 19000, admin UI 15173, client UI
# 15174. Mailpit is common's, on http://localhost:8025.

x-shared-env: &shared-env
  # consent-manager uses 0 and its sandbox 1
  REDIS_DATABASE: "2"

services:
  catcher:
    ports: !override ["19000:9000"]

  client-api:
    ports: !override ["18080:8080", "127.0.0.1:19080:9080"]
    environment: *shared-env

  admin-api:
    ports: !override ["18081:8081", "127.0.0.1:19081:9081"]
    environment:
      <<: *shared-env
      # The shared PostgreSQL has no read-only reporting role (ADR-050), so the traffic job reads as notification_app.
      DB_REPORTING_USER: ""

  dispatcher:
    ports: !override ["127.0.0.1:18082:8082"]
    environment: *shared-env

  admin-ui:
    ports: !override ["15173:8080"]

  client-ui:
    ports: !override ["15174:8080"]
