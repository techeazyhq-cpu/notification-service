# Infra only:            docker compose up -d
# Infra + all services + both UIs:  docker compose --profile app up -d --build
name: notification-service

# Sized so the whole stack runs on an ordinary laptop (8 GB, 2 CPUs): it idles at about 2 GB, the limits cap it at about
# 5 GB, and none asks for more than one CPU. Override with NS_APP_CPUS / NS_APP_MEM (the Java
# services and migration job), NS_PULSAR_MEM / NS_PULSAR_JVM (Pulsar) and NS_POSTGRES_MEM (Postgres).
#
# The Java services give 75% of the limit to the heap (see the Dockerfile) and idle at about 400 MB.
x-app: &app
  deploy:
    resources:
      limits:
        cpus: "${NS_APP_CPUS:-1.0}"
        memory: ${NS_APP_MEM:-768m}

x-small: &small
  deploy:
    resources:
      limits: {cpus: "0.25", memory: 128m}

x-svc-env: &svc-env
  DB_URL: jdbc:postgresql://postgres:5432/notification
  # DML-only role: these three services never run DDL, so they don't get the schema-owning
  # notification/notification credentials the migration job uses. See ADR-012.
  DB_USER: ${DB_APP_USER:-notification_app}
  DB_PASSWORD: ${DB_APP_PASSWORD:-notification_app}
  REDIS_HOST: redis
  PULSAR_URL: pulsar://pulsar:6650
  VIRTUAL_THREADS_ENABLED: ${VIRTUAL_THREADS_ENABLED:-false}
  # Encrypts provider secrets (SMTP password, gateway auth header) at rest; must be the same value on every
  # service, since admin-api encrypts with it and client-api/dispatcher decrypt with it. See ADR-013.
  SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-development-only-change-me}
  # Encrypts message template variables (names, one-time codes) at rest; the same value on every service.
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-development-only-change-me}
  PROVIDER_TRUSTED_HOSTS: ${PROVIDER_TRUSTED_HOSTS:-mailpit,catcher}
  LOG_FORMAT: ${LOG_FORMAT:-}
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
  # Without this, a service refuses to start with the default DB_PASSWORD/ADMIN_PASSWORD/keys above
  # (see notification-core's InsecureDefaults and ADR-013).
  SPRING_PROFILES_ACTIVE: local

services:
  postgres:
    image: postgres:16-alpine
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: ${NS_POSTGRES_MEM:-512m}
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
      DB_APP_USER: ${DB_APP_USER:-notification_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-notification_app}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification"]
      interval: 5s
      retries: 10

  redis:
    <<: *small
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  pulsar:
    image: apachepulsar/pulsar:3.3.3
    command: sh -c "bin/apply-config-from-env.py conf/standalone.conf && exec bin/pulsar standalone -nfw -nss"
    # Heap plus direct memory stay well inside the limit, leaving room for metaspace and threads.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: ${NS_PULSAR_MEM:-1536m}
    environment:
      PULSAR_MEM: ${NS_PULSAR_JVM:--Xms256m -Xmx512m -XX:MaxDirectMemorySize=256m}
      defaultRetentionTimeInMinutes: "60"
      defaultRetentionSizeInMB: "1024"
    ports: ["6650:6650", "8088:8080"]
    volumes: [pulsardata:/pulsar/data]
    healthcheck:
      # Over HTTP: `pulsar-admin` would start a second JVM inside the memory limit on every check.
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/admin/v2/brokers/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # Email catcher: SMTP on 1025, web UI on http://localhost:8025
  mailpit:
    <<: *small
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  # SMS / WhatsApp / Push catcher: web UI on http://localhost:9000
  catcher:
    <<: *small
    build: ./tools/catcher
    ports: ["9000:9000"]

  # One-shot job: applies pending schema changes (Liquibase), then exits. The services start only after it succeeded.
  # Other commands: docker compose run --rm db-migrate status | update-sql | validate | history
  db-migrate:
    <<: *app
    profiles: [app]
    build: { context: ., args: { MODULE: db-migration } }
    command: ["update"]
    restart: "no"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notification
      DB_USER: notification
      DB_PASSWORD: notification
      # Without this, the job refuses to run with the default DB_PASSWORD above (see MigrationApplication).
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      postgres: { condition: service_healthy }

  client-api:
    <<: *app
    profiles: [app]
    build: { context: ., args: { MODULE: client-api } }
    ports: ["8080:8080", "127.0.0.1:9080:9080"]
    environment:
      <<: *svc-env
      # Turns on AI template drafting (ADR-041) in the client API and the client UI; unset leaves it off.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: &svc-deps
      db-migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      pulsar: { condition: service_healthy }

  admin-api:
    <<: *app
    profiles: [app]
    build: { context: ., args: { MODULE: admin-api } }
    ports: ["8081:8081", "127.0.0.1:9081:9081"]
    environment:
      <<: *svc-env
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      ADMIN_TWO_FACTOR_KEY: ${ADMIN_TWO_FACTOR_KEY:-development-only-change-me}
      ADMIN_REQUIRE_PASSWORD_CHANGE: ${ADMIN_REQUIRE_PASSWORD_CHANGE:-false}
      ADMIN_REQUIRE_TWO_FACTOR: ${ADMIN_REQUIRE_TWO_FACTOR:-false}
      API_DOCS_ENABLED: ${ADMIN_API_DOCS_ENABLED:-true}
      ANOMALY_AGGREGATION_CRON: ${ANOMALY_AGGREGATION_CRON:-0 5 * * * *}
      # Turns on AI template drafting (ADR-041) in the admin API and the admin UI; unset leaves it off.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: *svc-deps

  dispatcher:
    <<: *app
    profiles: [app]
    build: { context: ., args: { MODULE: dispatcher } }
    ports: ["127.0.0.1:8082:8082"]
    environment: *svc-env
    depends_on: *svc-deps

  # Admin UI on http://localhost:5173 (admin / admin); nginx proxies /api to admin-api
  admin-ui:
    <<: *small
    profiles: [app]
    build: ./admin-ui
    ports: ["5173:8080"]
    depends_on: [admin-api]

  # Client tracking UI on http://localhost:5174; sign in with a client API key; nginx proxies /v1 to client-api
  client-ui:
    <<: *small
    profiles: [app]
    build: ./client-ui
    ports: ["5174:8080"]
    depends_on: [client-api]

volumes:
  pgdata:
  pulsardata:
