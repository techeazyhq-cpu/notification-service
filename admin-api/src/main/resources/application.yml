server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: notification-admin-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${DB_USER:notification}
    password: ${DB_PASSWORD:notification}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

notification:
  pulsar:
    service-url: ${PULSAR_URL:pulsar://localhost:6650}

billing:
  payment-terms-days: ${BILLING_PAYMENT_TERMS_DAYS:30}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin}
  cors-origins: ${ADMIN_CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
