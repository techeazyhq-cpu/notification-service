server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: notification-admin-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${DB_USER:notification_app}
    password: ${DB_PASSWORD:notification_app}
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:false}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}

notification:
  secrets-key: ${SECRETS_ENCRYPTION_KEY:development-only-change-me}
  data-key: ${DATA_ENCRYPTION_KEY:development-only-change-me}
  # Earlier keys, comma-separated, that still decrypt what they wrote during a rotation (ADR-037).
  secrets-key-previous: ${SECRETS_ENCRYPTION_KEY_PREVIOUS:}
  data-key-previous: ${DATA_ENCRYPTION_KEY_PREVIOUS:}
  # Keys recipient fingerprints; defaults to the data key and must outlive a data-key rotation.
  fingerprint-key: ${FINGERPRINT_KEY:${DATA_ENCRYPTION_KEY:development-only-change-me}}
  pulsar:
    service-url: ${PULSAR_URL:pulsar://localhost:6650}
    tls-trust-certs-file: ${PULSAR_TLS_TRUST_CERTS_FILE:}
  provider-egress:
    trusted-hosts: ${PROVIDER_TRUSTED_HOSTS:}
    other-public-hosts-allowed: ${PROVIDER_OTHER_PUBLIC_HOSTS_ALLOWED:true}

retention:
  enabled: false
  cron: ${RETENTION_CRON:0 30 2 * * *}
  personal-data-days: ${RETENTION_PERSONAL_DATA_DAYS:90}
  delete-days: ${RETENTION_DELETE_DAYS:400}
  idempotency-days: ${RETENTION_IDEMPOTENCY_DAYS:7}
  batch-size: ${RETENTION_BATCH_SIZE:5000}

anomaly:
  enabled: ${ANOMALY_ENABLED:true}
  aggregation-cron: ${ANOMALY_AGGREGATION_CRON:0 5 * * * *}
  backfill-days: ${ANOMALY_BACKFILL_DAYS:56}
  retention-days: ${ANOMALY_RETENTION_DAYS:400}
  # Where the hourly job reads messages from (ADR-050). With no user it reads through the service's own connection;
  # with one it logs in as that read-only role, at DB_REPORTING_URL (a read replica) or else at DB_URL.
  reporting-database:
    url: ${DB_REPORTING_URL:${DB_URL:jdbc:postgresql://localhost:5432/notification}}
    username: ${DB_REPORTING_USER:}
    password: ${DB_REPORTING_PASSWORD:}

billing:
  payment-terms-days: ${BILLING_PAYMENT_TERMS_DAYS:30}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin}
  two-factor-key: ${ADMIN_TWO_FACTOR_KEY:development-only-change-me}
  two-factor-key-previous: ${ADMIN_TWO_FACTOR_KEY_PREVIOUS:}
  issuer: ${ADMIN_ISSUER:Notification Admin}
  session-idle-minutes: ${ADMIN_SESSION_IDLE_MINUTES:30}
  session-max-hours: ${ADMIN_SESSION_MAX_HOURS:12}
  max-failed-attempts: ${ADMIN_MAX_FAILED_ATTEMPTS:5}
  lockout-minutes: ${ADMIN_LOCKOUT_MINUTES:15}
  require-password-change: ${ADMIN_REQUIRE_PASSWORD_CHANGE:true}
  require-two-factor: ${ADMIN_REQUIRE_TWO_FACTOR:true}
  cors-origins: ${ADMIN_CORS_ORIGINS:http://localhost:5173}

# AI drafting of message templates (ADR-041). These are the defaults until an administrator saves settings on the
# admin UI's AI drafting page (ADR-044); without a key in either place drafting is off.
template-drafting:
  # ANTHROPIC, OPENAI, GEMINI, DEEPSEEK, OLLAMA or OPENAI_COMPATIBLE; the base URL is optional except for the last.
  provider: ${TEMPLATE_DRAFTING_PROVIDER:ANTHROPIC}
  base-url: ${TEMPLATE_DRAFTING_BASE_URL:}
  # Not needed for a local Ollama. ANTHROPIC_API_KEY is still read, for deployments that set only it.
  api-key: ${TEMPLATE_DRAFTING_API_KEY:${ANTHROPIC_API_KEY:}}
  model: ${TEMPLATE_DRAFTING_MODEL:claude-opus-5-5}
  effort: ${TEMPLATE_DRAFTING_EFFORT:low}
  max-tokens: ${TEMPLATE_DRAFTING_MAX_TOKENS:8000}
  # Tokens, input and output together, per calendar month (UTC): for all drafting, and for each client.
  monthly-token-budget: ${TEMPLATE_DRAFTING_MONTHLY_TOKENS:2000000}
  client-monthly-token-budget: ${TEMPLATE_DRAFTING_CLIENT_MONTHLY_TOKENS:200000}
  requests-per-minute: ${TEMPLATE_DRAFTING_REQUESTS_PER_MINUTE:5}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  server:
    port: ${MANAGEMENT_PORT:9081}
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
