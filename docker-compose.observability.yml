#
# Local observability: Jaeger receives the services' OpenTelemetry spans (http://localhost:16686), and Prometheus
# scrapes their metrics and evaluates the SLO rules and alerts (http://localhost:9090/alerts).
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile app up -d --build
# See ADR-023 and ADR-024.
services:
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports: ["127.0.0.1:16686:16686"]

  prometheus:
    image: prom/prometheus:v3.13.4
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./deploy/observability/prometheus:/etc/prometheus:ro

  client-api:
    environment:
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      jaeger: { condition: service_started }

  admin-api:
    environment:
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      jaeger: { condition: service_started }

  dispatcher:
    environment:
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      jaeger: { condition: service_started }
