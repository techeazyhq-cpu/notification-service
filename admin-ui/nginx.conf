server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve the upstream lazily (per request) so nginx starts even if the API container is still booting.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $upstream http://admin-api:8081;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Single-page app: unknown paths fall back to index.html so client-side routes survive a refresh.
  location / {
    try_files $uri /index.html;
  }
}
