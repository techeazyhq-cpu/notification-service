#
# Client side of the encrypted connections (ADR-017) for the `notification` project: the services and the migration job
# reach PostgreSQL with verify-full, Redis over TLS and Pulsar over TLS with hostname verification, trusting the CA that
# docker-compose.common.encrypted.yml created in the volume `notification-certs`. Start `common` with that overlay
# first. Combine with docker-compose.tls.yml to also encrypt the public edge.
#
#   docker compose -f docker-compose.common.yml -f docker-compose.common.encrypted.yml up -d --wait
#   docker compose -f docker-compose.yml -f docker-compose.encrypted.yml --profile app up -d --build
name: notification

x-ca-mount: &ca-mount
  type: volume
  source: certs
  target: /certs/ca
  read_only: true
  volume: { subpath: ca }

services:
  db-migrate:
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notification?sslmode=verify-full&sslrootcert=/certs/ca/ca.crt
    volumes: [*ca-mount]

  client-api: &encrypted-service
    environment: &encrypted-env
      DB_URL: jdbc:postgresql://postgres:5432/notification?sslmode=verify-full&sslrootcert=/certs/ca/ca.crt
      PULSAR_URL: pulsar+ssl://pulsar:6651
      PULSAR_TLS_TRUST_CERTS_FILE: /certs/ca/ca.crt
      SPRING_DATA_REDIS_SSL_ENABLED: "true"
      SPRING_DATA_REDIS_SSL_BUNDLE: redis
      SPRING_SSL_BUNDLE_PEM_REDIS_TRUSTSTORE_CERTIFICATE: file:/certs/ca/ca.crt
    volumes: [*ca-mount]

  admin-api:
    <<: *encrypted-service
    environment:
      <<: *encrypted-env

  dispatcher:
    <<: *encrypted-service
    environment:
      <<: *encrypted-env

volumes:
  certs:
    name: notification-certs
    external: true
