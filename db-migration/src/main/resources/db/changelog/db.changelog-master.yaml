# Master changelog. Files are applied in the order listed; never reorder or edit a changeset that has been released
# (Liquibase verifies checksums). To change the schema, add a new file below and a new changeset in it.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-baseline.sql
  - include:
      file: db/changelog/changes/002-client-tracking-indexes.sql
  - include:
      file: db/changelog/changes/003-client-owned-templates.sql
  - include:
      file: db/changelog/changes/004-billing.sql
  - include:
      file: db/changelog/changes/005-admin-accounts.sql
  - include:
      file: db/changelog/changes/006-client-senders.sql
  - include:
      file: db/changelog/changes/007-personal-data-retention.sql
  - include:
      file: db/changelog/changes/008-dead-letters.sql
  - include:
      file: db/changelog/changes/009-admin-roles.sql
