# @author Vasantha Kumar <vasantha.kumar@hotmail.com>
#
# Daily logical dump of the Cloud SQL database to the bucket in the recovery region (ADR-026, ADR-030). The dump runs
# deploy/backup/postgres-backup.sh as the read-capable runtime role; the upload runs under Workload Identity as a
# Google service account that can only create objects in that bucket. Fill the placeholders from
# `terraform output manifest_values`, naming them so the shell variables below are left alone:
#   kubectl -n notification create configmap notification-backup-scripts --from-file=deploy/backup/postgres-backup.sh
#   envsubst '${LOGICAL_BACKUP_SERVICE_ACCOUNT} ${POSTGRES_PRIVATE_IP} ${BACKUP_BUCKET} ${PRIVATE_SERVICES_CIDR}'
#     < logical-backup.yaml | kubectl apply -f -
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-logical-backup
  namespace: notification
  annotations:
    iam.gke.io/gcp-service-account: "${LOGICAL_BACKUP_SERVICE_ACCOUNT}"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: notification-logical-backup
  namespace: notification
spec:
  schedule: "30 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: notification-logical-backup
        spec:
          serviceAccountName: notification-logical-backup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: dump
              image: postgres:16
              command: [bash, /scripts/postgres-backup.sh, --output-dir, /backups]
              env:
                - {name: DATABASE_URL, value: "postgresql://notification_app@${POSTGRES_PRIVATE_IP}:5432/notification"}
                - {name: PGSSLMODE, value: verify-ca}
                - {name: PGSSLROOTCERT, value: /etc/db-ca/ca-bundle.pem}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: notification-secrets, key: DB_PASSWORD}}
              securityContext: &hardened
                runAsUser: 999
                runAsGroup: 999
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 250m, memory: 256Mi}
                limits: {memory: 1Gi}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: db-ca, mountPath: /etc/db-ca, readOnly: true}
                - {name: backups, mountPath: /backups}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: upload
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-slim
              command: [sh, -c]
              args:
                - >-
                  gcloud storage cp /backups/* "gs://${BACKUP_BUCKET}/$$(date -u +%Y/%m/%d)/"
                  --no-user-output-enabled
              env:
                - {name: HOME, value: /tmp}
                - {name: CLOUDSDK_CONFIG, value: /tmp/gcloud}
              securityContext: *hardened
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 768Mi}
              volumeMounts:
                - {name: backups, mountPath: /backups, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: scripts
              configMap: {name: notification-backup-scripts}
            - name: db-ca
              configMap: {name: db-ca-bundle}
            - name: backups
              emptyDir: {sizeLimit: 20Gi}
            - name: tmp
              emptyDir: {sizeLimit: 256Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-logical-backup
  namespace: notification
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notification-logical-backup
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: "${PRIVATE_SERVICES_CIDR}"}
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock: {cidr: 169.254.169.254/32}
      ports:
        - {protocol: TCP, port: 80}
    - to:
        - ipBlock: {cidr: 169.254.169.252/32}
      ports:
        - {protocol: TCP, port: 988}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}
