#
# Builds the chart's notification-secrets Secret from Secret Manager (ADR-030), before the first helm install. The
# SecretStore authenticates through Workload Identity as the notification-external-secrets service account, which may
# impersonate a Google service account that can read only this environment's secrets. Fill the placeholders from
# `terraform output manifest_values`:
#   envsubst '${PROJECT_ID} ${CLUSTER_LOCATION} ${CLUSTER_NAME} ${SECRET_PREFIX} ${EXTERNAL_SECRETS_SERVICE_ACCOUNT}'
#     < external-secrets.yaml | kubectl apply -f -
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-external-secrets
  namespace: notification
  annotations:
    iam.gke.io/gcp-service-account: "${EXTERNAL_SECRETS_SERVICE_ACCOUNT}"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: google-secret-manager
  namespace: notification
spec:
  provider:
    gcpsm:
      projectID: "${PROJECT_ID}"
      auth:
        workloadIdentity:
          clusterLocation: "${CLUSTER_LOCATION}"
          clusterName: "${CLUSTER_NAME}"
          clusterProjectID: "${PROJECT_ID}"
          serviceAccountRef:
            name: notification-external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-secrets
  namespace: notification
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: google-secret-manager
    kind: SecretStore
  target:
    name: notification-secrets
    creationPolicy: Owner
  data:
    - {secretKey: DB_PASSWORD, remoteRef: {key: "${SECRET_PREFIX}db-password"}}
    - {secretKey: SECRETS_ENCRYPTION_KEY, remoteRef: {key: "${SECRET_PREFIX}secrets-encryption-key"}}
    - {secretKey: DATA_ENCRYPTION_KEY, remoteRef: {key: "${SECRET_PREFIX}data-encryption-key"}}
    - {secretKey: ADMIN_TWO_FACTOR_KEY, remoteRef: {key: "${SECRET_PREFIX}admin-two-factor-key"}}
    - {secretKey: ADMIN_PASSWORD, remoteRef: {key: "${SECRET_PREFIX}admin-password"}}
    - {secretKey: MIGRATION_DB_PASSWORD, remoteRef: {key: "${SECRET_PREFIX}migration-db-password"}}
    - {secretKey: REDIS_PASSWORD, remoteRef: {key: "${SECRET_PREFIX}redis-password"}}
