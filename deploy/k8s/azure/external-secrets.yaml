#
# Builds the chart's notification-secrets Secret from Azure Key Vault (ADR-029), before the first helm install. The
# SecretStore authenticates as the notification-external-secrets service account, federated with a managed identity
# that can only read this vault's secrets. Fill the placeholders from `terraform output manifest_values`:
#   envsubst '${KEY_VAULT_URI} ${EXTERNAL_SECRETS_CLIENT_ID}' < external-secrets.yaml | kubectl apply -f -
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-external-secrets
  namespace: notification
  annotations:
    azure.workload.identity/client-id: "${EXTERNAL_SECRETS_CLIENT_ID}"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-key-vault
  namespace: notification
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "${KEY_VAULT_URI}"
      serviceAccountRef:
        name: notification-external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-secrets
  namespace: notification
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault
    kind: SecretStore
  target:
    name: notification-secrets
    creationPolicy: Owner
  data:
    - {secretKey: DB_PASSWORD, remoteRef: {key: db-password}}
    - {secretKey: SECRETS_ENCRYPTION_KEY, remoteRef: {key: secrets-encryption-key}}
    - {secretKey: DATA_ENCRYPTION_KEY, remoteRef: {key: data-encryption-key}}
    - {secretKey: ADMIN_TWO_FACTOR_KEY, remoteRef: {key: admin-two-factor-key}}
    - {secretKey: ADMIN_PASSWORD, remoteRef: {key: admin-password}}
    - {secretKey: MIGRATION_DB_PASSWORD, remoteRef: {key: migration-db-password}}
    - {secretKey: REDIS_PASSWORD, remoteRef: {key: redis-password}}
