# @author Vasantha Kumar <vasantha.kumar@hotmail.com>
#
# Daily logical dump of the RDS database to the bucket in the recovery region (ADR-026, ADR-028): an independent copy
# next to RDS's own backups, and the input of the restore drill. The dump runs deploy/backup/postgres-backup.sh as the
# read-capable runtime role; the upload runs under the notification-logical-backup pod identity, which can write only
# to that bucket. Fill the placeholders from `terraform output` and apply:
#   kubectl -n notification create configmap notification-backup-scripts --from-file=deploy/backup/postgres-backup.sh
#   envsubst < logical-backup.yaml | kubectl apply -f -
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-logical-backup
  namespace: notification
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: notification-logical-backup
  namespace: notification
spec:
  schedule: "30 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: notification-logical-backup
        spec:
          serviceAccountName: notification-logical-backup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: dump
              image: postgres:16
              command: [bash, /scripts/postgres-backup.sh, --output-dir, /backups]
              env:
                - {name: DATABASE_URL, value: "postgresql://notification_app@${POSTGRES_ADDRESS}:5432/notification"}
                - {name: PGSSLMODE, value: verify-full}
                - {name: PGSSLROOTCERT, value: /etc/rds/global-bundle.pem}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: notification-secrets, key: DB_PASSWORD}}
              securityContext: &hardened
                runAsUser: 999
                runAsGroup: 999
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 250m, memory: 256Mi}
                limits: {memory: 1Gi}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: rds-ca, mountPath: /etc/rds, readOnly: true}
                - {name: backups, mountPath: /backups}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: upload
              image: amazon/aws-cli:2.37.8
              command: [sh, -c]
              args:
                - aws s3 cp /backups "s3://${BACKUP_BUCKET}/$$(date -u +%Y/%m/%d)/" --recursive --only-show-errors
              env:
                - {name: AWS_REGION, value: "${DISASTER_RECOVERY_REGION}"}
                - {name: HOME, value: /tmp}
              securityContext: *hardened
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - {name: backups, mountPath: /backups, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: scripts
              configMap: {name: notification-backup-scripts}
            - name: rds-ca
              configMap: {name: rds-ca-bundle}
            - name: backups
              emptyDir: {sizeLimit: 20Gi}
            - name: tmp
              emptyDir: {sizeLimit: 64Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-logical-backup
  namespace: notification
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notification-logical-backup
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: "${VPC_CIDR}"}
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock: {cidr: 169.254.170.23/32}
      ports:
        - {protocol: TCP, port: 80}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}
