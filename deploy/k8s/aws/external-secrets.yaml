#
# Builds the chart's notification-secrets Secret from AWS Secrets Manager (ADR-028), before the first helm install:
# the five application values from the secret Terraform created, and the schema owner's password from the secret RDS
# manages and rotates. Needs the External Secrets Operator; its controller has a pod identity that can read only these
# two secrets. Fill the placeholders from `terraform output` and apply:
#   envsubst < external-secrets.yaml | kubectl apply -f -
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: notification
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-secrets
  namespace: notification
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: notification-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef: {key: "${APPLICATION_SECRET_ARN}", property: DB_PASSWORD}
    - secretKey: SECRETS_ENCRYPTION_KEY
      remoteRef: {key: "${APPLICATION_SECRET_ARN}", property: SECRETS_ENCRYPTION_KEY}
    - secretKey: DATA_ENCRYPTION_KEY
      remoteRef: {key: "${APPLICATION_SECRET_ARN}", property: DATA_ENCRYPTION_KEY}
    - secretKey: ADMIN_TWO_FACTOR_KEY
      remoteRef: {key: "${APPLICATION_SECRET_ARN}", property: ADMIN_TWO_FACTOR_KEY}
    - secretKey: ADMIN_PASSWORD
      remoteRef: {key: "${APPLICATION_SECRET_ARN}", property: ADMIN_PASSWORD}
    - secretKey: MIGRATION_DB_PASSWORD
      remoteRef: {key: "${POSTGRES_OWNER_SECRET_ARN}", property: password}
