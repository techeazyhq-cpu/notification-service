#
# Point-in-time recovery: a NEW cluster built from the base backups and archived WAL of notification-db, replayed up
# to targetTime (UTC), e.g. the moment before a destructive change. Recovery never touches the original cluster.
# Procedure, verification and cut-over: docs/disaster-recovery.md.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: notification-db-restored
  namespace: datastores
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 20Gi
  walStorage:
    size: 10Gi
  bootstrap:
    recovery:
      source: notification-db-archive
      recoveryTarget:
        targetTime: "2026-10-02T09:00:00Z"
  externalClusters:
    - name: notification-db-archive
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: notification-backups
          serverName: notification-db
