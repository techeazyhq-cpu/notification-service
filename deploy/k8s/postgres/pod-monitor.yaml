#
# Scrapes every instance of notification-db for deploy/observability/prometheus/postgres-recovery.rules.yml (requires
# the Prometheus Operator CRDs). The cluster label is what the alerts group by. The instance exporter serves both the
# pg_stat_archiver metrics (primary only) and the Barman Cloud plugin's backup timestamps.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: notification-db
  namespace: datastores
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: notification-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cluster
