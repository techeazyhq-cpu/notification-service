#
# Where CloudNativePG archives WAL and base backups (Barman Cloud plugin). Example for AWS S3 with a bucket in another
# region or account than the cluster, so one regional failure cannot take both. Retention of 30 days bounds how far
# back point-in-time recovery reaches. Secret notification-backup-store: ACCESS_KEY_ID, ACCESS_SECRET_KEY (or use
# inheritFromIAMRole / workload identity instead of keys). See docs/disaster-recovery.md.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: notification-backups
  namespace: datastores
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://example-notification-backups/postgres
    s3Credentials:
      accessKeyId:
        name: notification-backup-store
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: notification-backup-store
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
