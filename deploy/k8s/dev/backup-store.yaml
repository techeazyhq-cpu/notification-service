#
# DEVELOPMENT ONLY: an S3-compatible store (SeaweedFS) inside the cluster and the ObjectStore pointing at it, so the
# CloudNativePG backups and point-in-time recovery in deploy/k8s/postgres can be tried locally. Needs the Secret
# notification-backup-store (ACCESS_KEY_ID, ACCESS_SECRET_KEY) in namespace datastores. Use object-store.yaml in
# production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-store-config
  namespace: datastores
data:
  entrypoint.sh: |
    cat > /tmp/s3.json <<JSON
    {"identities": [{"name": "backups", "credentials": [{"accessKey": "${ACCESS_KEY_ID}",
      "secretKey": "${ACCESS_SECRET_KEY}"}], "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
    JSON
    exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=512
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-store
  namespace: datastores
spec:
  selector: {matchLabels: {app: backup-store}}
  template:
    metadata: {labels: {app: backup-store}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          command: [sh, /config/entrypoint.sh]
          envFrom:
            - secretRef: {name: notification-backup-store}
          ports: [{containerPort: 8333}]
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: backup-store-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backup-store
  namespace: datastores
spec:
  selector: {app: backup-store}
  ports: [{port: 8333}]
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: notification-backups
  namespace: datastores
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://notification-backups/postgres
    endpointURL: http://backup-store.datastores:8333
    s3Credentials:
      accessKeyId:
        name: notification-backup-store
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: notification-backup-store
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
