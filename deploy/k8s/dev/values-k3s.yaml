# DEVELOPMENT ONLY: values for trying the chart on a local k3s with deploy/k8s/dev/datastores.yaml and images built
# locally and imported into the cluster (see deploy/k8s/dev/README.md).
image:
  registry: registry.local
  tag: test
  pullPolicy: Never

config:
  database:
    url: jdbc:postgresql://postgres.datastores:5432/notification
  redis:
    host: redis.datastores
  pulsar:
    url: pulsar://pulsar.datastores:6650
  providerTrustedHosts: catcher.datastores,mailpit.datastores
  tracingSamplingProbability: "1.0"
  clientApiPublicBaseUrl: http://api.notification.localhost:8880
  clientApiCorsOrigins: http://app.notification.localhost:8880
  adminCorsOrigins: http://admin.notification.localhost:8880

clientApi:
  replicas: 1
  autoscaling: {enabled: false}
adminApi:
  replicas: 1
dispatcher:
  replicas: 1
  autoscaling: {enabled: false}
adminUi:
  replicas: 1
clientUi:
  replicas: 1

ingress:
  className: traefik
  hosts:
    api: api.notification.localhost
    app: app.notification.localhost
    admin: admin.notification.localhost

networkPolicy:
  ingressControllerPeers:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {app.kubernetes.io/name: traefik}
  monitoringPeers: []
  datastoreEgress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: datastores}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 6650}
  providerEgress:
    trustedInternalEgress:
      - to:
          - namespaceSelector:
              matchLabels: {kubernetes.io/metadata.name: datastores}
            podSelector:
              matchExpressions:
                - {key: app, operator: In, values: [catcher, mailpit]}
        ports:
          - {protocol: TCP, port: 9000}
          - {protocol: TCP, port: 1025}
