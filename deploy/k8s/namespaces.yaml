# @author Vasantha Kumar Kesavan <vasantha.kumar@hotmail.com>
#
# The two namespaces of the platform (ADR-042), the same in development, shared mode and production:
#   common        the servers the services depend on: Pulsar, and wherever they run in the cluster PostgreSQL
#                 (CloudNativePG), Redis and Mailpit;
#   notification  the platform itself: client-api, admin-api, the dispatcher, the migration job and the two UIs.
# Managed datastores (RDS, Azure Database, Cloud SQL, ElastiCache and the like) live outside the cluster.
#
#   kubectl apply -f deploy/k8s/namespaces.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: common
  labels:
    app.kubernetes.io/part-of: notification-service
    notification-service/role: infrastructure
---
apiVersion: v1
kind: Namespace
metadata:
  name: notification
  labels:
    app.kubernetes.io/part-of: notification-service
    notification-service/role: services
