#
# SSD persistent disks through the Compute Engine PD CSI driver (built into GKE; disks are encrypted at rest by
# Google). WaitForFirstConsumer creates each disk in the zone its pod is scheduled to, which the zone spread of
# values.yaml relies on.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pulsar-disk
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-ssd
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain
