#
# Encrypted gp3 volumes through the EBS CSI driver (installed by deploy/terraform/aws). WaitForFirstConsumer creates
# each volume in the zone its pod is scheduled to, which the zone spread of values.yaml relies on. Every cloud's
# storage class for Pulsar has the same name, pulsar-disk, so values.yaml works unchanged on each of them.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pulsar-disk
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain
