#
# Values for the Apache Pulsar Helm chart (apache/pulsar 4.7.x) on the clusters of deploy/terraform (ADR-028, ADR-029).
# None of the three clouds offers managed Pulsar, and the broker holds nothing that cannot be rebuilt from PostgreSQL
# (ADR-026), so it runs in the cluster: three ZooKeeper, bookie and broker pods, one per availability zone, on
# encrypted SSD volumes, with TLS on the broker port the services use. Needs cert-manager and the cloud's
# storage-class-<cloud>.yaml, which provides pulsar-disk. See docs/<cloud>-deployment.md.
#   helm install pulsar apache/pulsar --version 4.7.0 -n pulsar --create-namespace -f values.yaml
#     --set initialize=true

volumes:
  persistence: true
  local_storage: false

affinity:
  anti_affinity: true
  type: requiredDuringSchedulingIgnoredDuringExecution

components:
  zookeeper: true
  bookkeeper: true
  autorecovery: true
  broker: true
  functions: false
  function_worker: false
  proxy: false
  toolset: true
  pulsar_manager: false
  dekaf: false

victoria-metrics-k8s-stack:
  enabled: false

tls:
  enabled: true
  broker:
    enabled: true

certs:
  internal_issuer:
    enabled: true
    type: selfsigning

zookeeper:
  replicaCount: 3
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          component: zookeeper
  volumes:
    data:
      size: 20Gi
      local_storage: false
      storageClassName: pulsar-disk

bookkeeper:
  replicaCount: 3
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          component: bookie
  volumes:
    journal:
      size: 20Gi
      local_storage: false
      storageClassName: pulsar-disk
    ledgers:
      size: 100Gi
      local_storage: false
      storageClassName: pulsar-disk

autorecovery:
  replicaCount: 1

broker:
  replicaCount: 3
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          component: broker
  configData:
    managedLedgerDefaultEnsembleSize: "2"
    managedLedgerDefaultWriteQuorum: "2"
    managedLedgerDefaultAckQuorum: "2"
