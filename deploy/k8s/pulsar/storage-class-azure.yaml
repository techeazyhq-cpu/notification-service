#
# Premium SSD through the Azure Disk CSI driver (built into AKS; disks are encrypted at rest by the platform).
# WaitForFirstConsumer creates each disk in the zone its pod is scheduled to, which the zone spread of values.yaml
# relies on.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pulsar-disk
provisioner: disk.csi.azure.com
parameters:
  skuName: Premium_LRS
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain
