# Settings shared by every Google Cloud environment built with deploy/terraform/gcp (ADR-030). The environment-specific
# values (database URL, Redis host and port, datastore egress) come from `terraform output -json helm_values`; pass
# them after this file. Hosts and TLS are per environment too. See docs/gcp-deployment.md.

config:
  redis:
    passwordFromSecret: true
    tlsTrustCertificateFile: /etc/redis-ca/ca.pem
  pulsar:
    url: pulsar+ssl://pulsar-broker.pulsar.svc.cluster.local:6651
    tlsTrustCertsFile: /etc/pulsar-ca/ca.crt

clientApi: &serviceTrust
  extraVolumes:
    - name: db-ca
      configMap: {name: db-ca-bundle}
    - name: redis-ca
      configMap: {name: redis-ca}
    - name: pulsar-ca
      configMap: {name: pulsar-ca}
  extraVolumeMounts:
    - {name: db-ca, mountPath: /etc/db-ca, readOnly: true}
    - {name: redis-ca, mountPath: /etc/redis-ca, readOnly: true}
    - {name: pulsar-ca, mountPath: /etc/pulsar-ca, readOnly: true}

adminApi: *serviceTrust

dispatcher: *serviceTrust

migration:
  extraVolumes:
    - name: db-ca
      configMap: {name: db-ca-bundle}
  extraVolumeMounts:
    - {name: db-ca, mountPath: /etc/db-ca, readOnly: true}

ingress:
  className: nginx
