# Settings shared by every AWS environment built with deploy/terraform/aws (ADR-028). The environment-specific values
# (database URL, Redis host, datastore egress) come from `terraform output -json helm_values`; pass them after this
# file. Hosts and TLS are per environment too. See docs/aws-deployment.md.

config:
  redis:
    port: 6379
  pulsar:
    url: pulsar+ssl://pulsar-broker.pulsar.svc.cluster.local:6651
    tlsTrustCertsFile: /etc/pulsar-ca/ca.crt
  extraEnv:
    SPRING_DATA_REDIS_SSL_ENABLED: "true"

clientApi: &serviceTrust
  extraVolumes:
    - name: rds-ca
      configMap: {name: rds-ca-bundle}
    - name: pulsar-ca
      configMap: {name: pulsar-ca}
  extraVolumeMounts:
    - {name: rds-ca, mountPath: /etc/rds, readOnly: true}
    - {name: pulsar-ca, mountPath: /etc/pulsar-ca, readOnly: true}

adminApi: *serviceTrust

dispatcher: *serviceTrust

migration:
  extraVolumes:
    - name: rds-ca
      configMap: {name: rds-ca-bundle}
  extraVolumeMounts:
    - {name: rds-ca, mountPath: /etc/rds, readOnly: true}

ingress:
  className: nginx
