# @author Vasantha Kumar Kesavan <vasantha.kumar@hotmail.com>
#
# Alerts on abnormal tenant traffic: SMS pumping, a leaked API key, a runaway sender (ADR-039). They read the gauge the
# admin API exports for anomalies no administrator has decided yet; every admin API instance exports the same count,
# so the rules take the maximum, never the sum. Deciding an anomaly in the admin UI resolves the alert within a minute.
# Checked and unit-tested in CI with promtool (traffic-anomaly.test.yml). Runbook: docs/slo.md#traffic-anomaly-high.
groups:
  - name: traffic-anomaly
    rules:
      - alert: TrafficAnomalyHigh
        expr: max by (channel) (notification_traffic_anomalies_open{severity="HIGH"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} high-severity traffic anomaly(ies) open on {{ $labels.channel }}"
          description: "A tenant's {{ $labels.channel }} traffic is far outside its own baseline, or reaches a country it
            has not sent to before. Nothing is blocked automatically: until someone looks, the spend cap or prepaid
            credit is the only limit."
          runbook: docs/slo.md#traffic-anomaly-high
