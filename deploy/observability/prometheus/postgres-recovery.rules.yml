#
# Alerts that guard PostgreSQL's recovery point and recovery time (docs/disaster-recovery.md, ADR-026). They read the
# CloudNativePG instance exporter and the Barman Cloud plugin metrics, scraped by deploy/k8s/postgres/pod-monitor.yaml,
# which also adds the cluster label. Checked and unit-tested in CI with promtool (postgres-recovery.test.yml).
groups:
  - name: postgres-recovery
    rules:
      - alert: PostgresWalArchivingFailing
        expr: |
          max by (namespace, cluster) (
              (cnpg_pg_stat_archiver_seconds_since_last_failure >= 0)
            and
              (cnpg_pg_stat_archiver_seconds_since_last_failure < cnpg_pg_stat_archiver_seconds_since_last_archival)
          )
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "WAL archiving of {{ $labels.namespace }}/{{ $labels.cluster }} is failing"
          description: "No WAL segment has been archived since the uploads started failing, so the recovery point is
            falling behind."
          runbook: docs/disaster-recovery.md#wal-archiving-failing
      - alert: PostgresWalArchiveStalled
        expr: |
          max by (namespace, cluster) (cnpg_collector_pg_wal_archive_status{value="ready"}) > 0
          and on (namespace, cluster)
          max by (namespace, cluster) (
              cnpg_pg_stat_archiver_seconds_since_last_archival > 900
            or
              cnpg_pg_stat_archiver_seconds_since_last_archival < 0
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "WAL of {{ $labels.namespace }}/{{ $labels.cluster }} is waiting to be archived and nothing has
            been archived for 15 minutes"
          runbook: docs/disaster-recovery.md#wal-archive-stalled
      - alert: PostgresBaseBackupTooOld
        expr: |
          time() - max by (namespace, cluster) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
            > 26 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The last base backup of {{ $labels.namespace }}/{{ $labels.cluster }} is older than 26 hours"
          description: "It is {{ $value | humanizeDuration }} old. Point-in-time recovery has to replay every WAL
            segment since, which stretches the recovery time."
          runbook: docs/disaster-recovery.md#base-backup-too-old
      - alert: PostgresBaseBackupFailed
        expr: |
          max by (namespace, cluster) (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp)
            > max by (namespace, cluster) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The latest base backup of {{ $labels.namespace }}/{{ $labels.cluster }} failed"
          runbook: docs/disaster-recovery.md#base-backup-failed
