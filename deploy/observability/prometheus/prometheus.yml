# Scrape configuration for the local observability overlay (docker-compose.observability.yml). In production, point
# your own Prometheus at the same management ports and load notification-slo.rules.yml; keep the job names, which
# the NotificationServiceDown alert matches on.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - notification-slo.rules.yml

scrape_configs:
  - job_name: notification-client-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["client-api:9080"]
  - job_name: notification-admin-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["admin-api:9081"]
  - job_name: notification-dispatcher
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["dispatcher:8082"]
